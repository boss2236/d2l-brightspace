[project]
name = "d2l-brightspace"
version = "0.1.0"
description = "Read your own Brightspace (D2L) content into local JSON: courses, assignments, announcements, grades, deadlines."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=2.2.0",
    "pypdf>=6.19.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
]

[project.scripts]
d2l = "d2l.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2l"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
